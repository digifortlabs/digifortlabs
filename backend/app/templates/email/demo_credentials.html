<html>
<body style="font-family: sans-serif;">
    <div style="max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px;">
        <h2>Welcome to Digifort Labs Demo!</h2>
        <p>Your demo account has been created with limited storage (100MB).</p>
        <div style="background: #f0f9ff; padding: 15px; border-radius: 5px; margin: 20px 0;">
            <p><strong>Email:</strong> {{ email }}</p>
            <p><strong>Password:</strong> {{ password }}</p>
            {% if slug %}
            <p><strong>Your Portal URL:</strong> <a href="https://{{ slug }}.digifortlabs.com">https://{{ slug }}.digifortlabs.com</a></p>
            {% endif %}
        </div>
        {% if slug %}
        <p><a href="https://{{ slug }}.digifortlabs.com/login" style="background: #2563eb; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; display: inline-block;">Login to Your Portal</a></p>
        {% else %}
        <p><a href="https://digifortlabs.com/login" style="background: #2563eb; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; display: inline-block;">Login Now</a></p>
        {% endif %}
    </div>
</body>
</html>
