<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigifortLabs Documentation Viewer</title>
    <style>
        :root {
            --sidebar-width: 250px;
            --primary-color: #2c3e50;
            --highlight-color: #3498db;
            --bg-color: #f5f7fa;
        }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            height: 100vh;
            background-color: var(--bg-color);
            overflow: hidden;
        }
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--primary-color);
            color: white;
            padding: 20px 0;
            overflow-y: auto;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            flex-shrink: 0;
        }
        .sidebar h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.5em;
            padding: 0 20px;
        }
        .nav-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .nav-item {
            padding: 15px 25px;
            cursor: pointer;
            transition: background 0.3s;
            border-left: 4px solid transparent;
        }
        .nav-item:hover {
            background-color: #34495e;
            border-left-color: var(--highlight-color);
        }
        .nav-item.active {
            background-color: #34495e;
            border-left-color: var(--highlight-color);
            font-weight: bold;
        }
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
        }
        /* Using an iframe avoids CORS issues on file:// */
        #content-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>DigifortLabs</h2>
        <ul class="nav-list" id="navList">
            <li class="nav-item active" data-file="index.md">Table of Contents</li>
            <li class="nav-item" data-file="chapter_1.md">Chapter 1: Patient Mgt</li>
            <li class="nav-item" data-file="chapter_2.md">Chapter 2: OPD & IPD</li>
            <li class="nav-item" data-file="chapter_3.md">Chapter 3: Pharmacy</li>
            <li class="nav-item" data-file="chapter_4.md">Chapter 4: Billing</li>
            <li class="nav-item" data-file="chapter_5.md">Chapter 5: Laboratory</li>
        </ul>
    </div>

    <div class="main-content">
        <!-- iframe will render the local HTML/MD files directly without fetch() -->
        <iframe id="content-frame" src="index.md"></iframe>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const navItems = document.querySelectorAll('.nav-item');
            const frame = document.getElementById('content-frame');

            navItems.forEach(item => {
                item.addEventListener('click', (e) => {
                    // Update active state
                    navItems.forEach(nav => nav.classList.remove('active'));
                    e.currentTarget.classList.add('active');
                    
                    // Load the file into the iframe
                    const fileToLoad = e.currentTarget.getAttribute('data-file');
                    frame.src = fileToLoad;
                });
            });
        });
    </script>
</body>
</html>
