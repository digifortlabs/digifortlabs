version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      # Use build args to bake the production API URL into the Next.js bundle
      args:
        - NEXT_PUBLIC_API_URL=https://digifortlabs.com/api
    container_name: digifortlabs-frontend-1
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://digifortlabs.com/api
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: digifortlabs_default
